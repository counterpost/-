name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'app.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk WorkoutTimer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WorkoutTimer-apk
          path: WorkoutTimer.apk

      - name: Publish to the "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: ワークアウトタイマー 最新版
          target_commitish: ${{ github.sha }}
          files: WorkoutTimer.apk
          body: |
            スマホでこのページを開き、WorkoutTimer.apk をダウンロードしてインストールしてください。
            ビルド: ${{ github.sha }}
